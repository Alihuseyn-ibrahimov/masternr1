{% extends "inbox/base.html" %}
{% block title %}Giriş — KlinikBot{% endblock %}
{% block content %}
<div class="card" style="max-width:360px; margin:60px auto;">
    <h2 style="margin-top:0;">KlinikBot — Giriş</h2>
    {% if form.errors %}
        <p style="color:#c92a2a;">İstifadəçi adı və ya şifrə yanlışdır.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <p><input type="text" name="username" placeholder="İstifadəçi adı" required></p>
        <p><input type="password" name="password" placeholder="Şifrə" required></p>
        <button class="primary" type="submit" style="width:100%;">Daxil ol</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</div>
{% endblock %}
